<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14171C;
  --surface:#1C2129;
  --surface-2:#242A34;
  --line:#2E3542;
  --text:#EDEFF2;
  --text-mute:#8A93A3;
  --gold:#E8B04B;
  --gold-dim:#3A2F1C;
  --green:#5FBF77;
  --green-dim:#1B2B20;
  --red:#C75450;
  --red-dim:#2E1E1D;
  --blue:#5C8AD6;
  --purple:#B79DE8;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px;}
h1{font-family:'Oswald',sans-serif;font-weight:600;font-size:26px;letter-spacing:0.5px;margin:0 0 2px;text-transform:uppercase;}
.sub{color:var(--text-mute);font-size:13px;margin:0 0 20px;}
.toprow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
input[type=text]{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:9px 12px;font-size:14px;flex:1;min-width:180px;}
input[type=text]:focus{outline:none;border-color:var(--blue);}
.tabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:8px;}
.tab{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:0.5px;text-transform:uppercase;padding:7px 14px;border-radius:6px;cursor:pointer;color:var(--text-mute);user-select:none;}
.tab.active{background:var(--surface-2);color:var(--gold);}
.reset{margin-left:auto;font-size:12px;color:var(--text-mute);cursor:pointer;border:1px solid var(--line);padding:8px 12px;border-radius:6px;}
.toggle-btn{font-size:12px;color:var(--text-mute);cursor:pointer;border:1px solid var(--line);padding:8px 12px;border-radius:6px;user-select:none;white-space:nowrap;}
.toggle-btn.on{color:var(--red);border-color:var(--red);background:var(--red-dim);}
.radarwrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px;}
.radarwrap h3{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:0.5px;text-transform:uppercase;margin:0 0 4px;color:var(--gold);}
.radarwrap .radarsub{font-size:11px;color:var(--text-mute);margin-bottom:10px;}
.radar-dot{cursor:pointer;transition:r 0.1s;}
.radar-dot:hover{stroke:var(--text);stroke-width:2;}
.radar-label{font-family:'JetBrains Mono',monospace;font-size:9px;fill:var(--text-mute);pointer-events:none;}
.radar-quadrant-label{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:0.5px;text-transform:uppercase;fill:var(--text-mute);opacity:0.6;}
.reset:hover{border-color:var(--red);color:var(--red);}
.modetabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:8px;}
.modetab{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:0.4px;text-transform:uppercase;padding:7px 12px;border-radius:6px;cursor:pointer;color:var(--text-mute);user-select:none;font-weight:500;transition:color 0.15s, background 0.15s;}
.modetab.active{background:var(--surface-2);font-weight:700;}
.modetab.active[data-mode="league"]{color:var(--gold);}
.modetab.active[data-mode="mine"]{color:var(--green);}
.modetab.active[data-mode="nextpick"]{color:var(--blue);}
.modetab.active[data-mode="takenow"]{color:var(--purple);}
.modetab.active[data-mode="riskadj"]{color:var(--red);}
.needbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;font-family:'JetBrains Mono',monospace;font-size:12px;}
.needchip{padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);}
.needchip .tag{color:var(--text-mute);margin-right:6px;}
.needchip.urgent{border-color:var(--gold);color:var(--gold);}
.needchip.neutral{border-color:var(--line);color:var(--text);}
.rec{padding:10px;border-radius:8px;margin-bottom:8px;border:1px solid var(--line);}
.rec.main{background:var(--gold-dim);border-color:var(--gold);}
.rec .rectag{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.4px;color:var(--gold);margin-bottom:3px;}
.rec.main .rectag{color:var(--gold);}
.rec:not(.main) .rectag{color:var(--text-mute);}
.rec .recname{font-weight:600;font-size:14px;}
.rec .recwhy{font-size:11px;color:var(--text-mute);margin-top:2px;}
.rec .recval{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gold);float:right;}
.byetag{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-mute);margin-left:6px;}
.byetag.conflict{color:var(--red);font-weight:600;}
.flagtag{font-size:10px;padding:1px 5px;border-radius:4px;margin-left:4px;font-family:'JetBrains Mono',monospace;}
.flagtag.risk{background:var(--red-dim);color:var(--red);}
.flagtag.opportunity{background:var(--green-dim);color:var(--green);}
.tierbreak{padding:4px 12px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--blue);background:#16202e;border-bottom:1px solid var(--line);letter-spacing:0.4px;text-align:center;}
.runalert{padding:8px 12px;margin-bottom:14px;border-radius:8px;background:var(--red-dim);border:1px solid var(--red);color:var(--red);font-family:'JetBrains Mono',monospace;font-size:12px;}
.turnbanner{padding:8px 12px;margin-bottom:14px;border-radius:8px;background:var(--surface);border:1px solid var(--blue);color:var(--blue);font-family:'JetBrains Mono',monospace;font-size:12px;}
.layout{display:grid;grid-template-columns:1fr 300px;gap:18px;}
@media (max-width:820px){.layout{grid-template-columns:1fr;}}
.board{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.row{display:grid;grid-template-columns:34px 1fr 74px 64px 78px 130px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;}
.row:last-child{border-bottom:none;}
.row.hdr{color:var(--text-mute);font-size:11px;text-transform:uppercase;letter-spacing:0.4px;font-family:'JetBrains Mono',monospace;background:var(--surface-2);}
.row.drafted{opacity:0.35;}
.row.drafted .name{text-decoration:line-through;}
.rank{font-family:'JetBrains Mono',monospace;color:var(--text-mute);}
.name{font-weight:500;}
.posbadge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 6px;border-radius:4px;margin-left:8px;vertical-align:1px;}
.pb-QB{background:#2B2140;color:#B79DE8;}
.pb-RB{background:var(--green-dim);color:var(--green);}
.pb-WR{background:#1D2C3D;color:var(--blue);}
.pb-TE{background:var(--gold-dim);color:var(--gold);}
.pb-K{background:var(--surface-2);color:var(--text-mute);}
.fpts{font-family:'JetBrains Mono',monospace;color:var(--text-mute);}
.val{font-family:'JetBrains Mono',monospace;font-weight:600;}
.val.pos{color:var(--gold);}
.val.neg{color:var(--text-mute);}
.acts{display:flex;gap:6px;justify-content:flex-end;}
.btn{font-family:'JetBrains Mono',monospace;font-size:11px;border:1px solid var(--line);background:transparent;color:var(--text);padding:5px 8px;border-radius:5px;cursor:pointer;}
.btn:hover{border-color:var(--gold);color:var(--gold);}
.btn.undo{color:var(--text-mute);}
.teamsel{font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:5px 6px;max-width:120px;}
.teamsel:focus{outline:none;border-color:var(--gold);}
.repline{padding:6px 12px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold);background:var(--gold-dim);border-bottom:1px solid var(--line);letter-spacing:0.4px;}
.side{display:flex;flex-direction:column;gap:14px;}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;}
.panel h2{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:0.5px;text-transform:uppercase;margin:0 0 10px;color:var(--text-mute);}
.slot{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;}
.slot:last-child{border-bottom:none;}
.slotlabel{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-mute);width:44px;}
.slotname{font-weight:500;flex:1;text-align:right;}
.slotname.empty{color:var(--text-mute);font-weight:400;}
.feeditem{font-size:12px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;}
.feeditem:last-child{border-bottom:none;}
.feedwho{font-family:'JetBrains Mono',monospace;font-size:10px;padding:1px 6px;border-radius:4px;}
.feedwho.mine{background:var(--green-dim);color:var(--green);}
.feedwho.opp{background:var(--red-dim);color:var(--red);}
.empty-feed{color:var(--text-mute);font-size:12px;}
</style>
</head>

<div class="wrap">
  <h1>Draft board <span style="color:var(--red);font-size:14px;vertical-align:middle;">[BUILD v-qbte-fix-22Aug]</span></h1>

      </div>

        <div id="feed"></div>

</div>

function needState(pos, counts){
  if (!NEED_MIN[pos]) return null;

  const remMax = Math.max(0, NEED_MAX[pos] - have);

  if (remMin > 0){ zone = 'urgent'; mult = 1 + 0.15 * remMin; }

  else { zone = 'discount'; mult = 0.4; }
  return { have, remMin, remMax, zone, mult };
}

// same way RB/WR does -- boosted when you don't have one yet, discounted once you're stocked past
// what you'd realistically start/stream. Deliberately separate from needState()/NEED_MIN so this
// never touches teamNeedMult()'s opponent-modeling path, which must keep using its own GENERIC_MIN/MAX logic.
const MY_SINGLE_SLOT_MIN = { QB: 1, TE: 1 };
const MY_SINGLE_SLOT_MAX = { QB: 2, TE: 2 };
function mySingleSlotNeedState(pos, counts){
  if (!MY_SINGLE_SLOT_MIN[pos]) return null;
  const have = counts[pos] || 0;
  const remMin = Math.max(0, MY_SINGLE_SLOT_MIN[pos] - have);
  const remMax = Math.max(0, MY_SINGLE_SLOT_MAX[pos] - have);
  let zone, mult;
  if (remMin > 0){ zone = 'urgent'; mult = 1 + 0.15 * remMin; }
  else if (remMax > 0){ zone = 'neutral'; mult = 1.0; }
  else { zone = 'discount'; mult = 0.4; }
  return { have, remMin, remMax, zone, mult };
}

// For single-slot positions (QB/TE), the naive "10th available" baseline assumes all 10 teams
// still need one -- but once some teams already have their starter, the real remaining demand is
// smaller than that. Using the true number of teams still shopping for the position is a more
// accurate replacement level than a fixed count that ignores what's already been filled.
function teamsStillNeeding(pos){
  let filled = 0;
  TEAMS.forEach(t => {
    const have = pickOrder.some(p => p.by === t.id && (PLAYERS.find(x => x.name === p.name) || {}).pos === pos);
    if (have) filled++;
  });
  return Math.max(1, TEAMS.length - filled);
}

// Same idea for RB/WR, but accounting for the shared FLEX pool: guaranteed slots are a clean
// yes/no per team, but FLEX capacity has to be split between the two positions. Uses the same
// 13:9 RB:WR ratio implied by the original static FLEX_N constants (33/39), applied to whatever
// FLEX capacity is ACTUALLY still open across the league right now, not assumed to be untouched.
function remainingFlexSharedN(pos){
  const NEED_MIN_LOCAL = { RB: 2, WR: 3 };
  let guaranteedRemaining = 0;
  let flexCapacityRemaining = 0;
  TEAMS.forEach(t => {
    const counts = teamPositionCounts(t.id);
    guaranteedRemaining += Math.max(0, NEED_MIN_LOCAL[pos] - (counts[pos] || 0));
    const excessRB = Math.max(0, (counts.RB || 0) - NEED_MIN_LOCAL.RB);
    const excessWR = Math.max(0, (counts.WR || 0) - NEED_MIN_LOCAL.WR);
    flexCapacityRemaining += Math.max(0, NEED_FLEX_SHARED - (excessRB + excessWR));
  });
  const RB_SHARE = 13 / 22, WR_SHARE = 9 / 22; // matches the original FLEX_N(33,39) implied split
  const share = pos === 'RB' ? RB_SHARE : WR_SHARE;
  return Math.max(1, guaranteedRemaining + Math.round(flexCapacityRemaining * share));
}

function baselineFor(pos, useFlex){
  const N = useFlex ? remainingFlexSharedN(pos) : (SINGLE_SLOT_POS.includes(pos) ? teamsStillNeeding(pos) : STARTER_N[pos]);
  const remaining = PLAYERS.filter(p => p.pos === pos && !drafted[p.name])
    .sort((a,b) => b.fpts - a.fpts);
  if (remaining.length === 0) return 0;
  const idx = Math.min(N - 1, remaining.length - 1);
  return remaining[idx].fpts;
}

function computeValues(){
  const baselines = {};
  ['QB','RB','WR','TE','K'].forEach(pos => {
    baselines[pos] = { vols: baselineFor(pos,false) };
    if (FLEX_N[pos]) baselines[pos].volf = baselineFor(pos,true);
  });
  const counts = myCounts();
  return PLAYERS.map(p => {
    const useFlex = !!FLEX_N[p.pos];
    const base = useFlex ? baselines[p.pos].volf : baselines[p.pos].vols;
    const value = Math.round((p.fpts - base) * 10) / 10;
    const ns = needState(p.pos, counts) || mySingleSlotNeedState(p.pos, counts);
    const myValue = ns ? Math.round(value * ns.mult * 10) / 10 : value;
    const rangePct = (p.high != null && p.low != null && (p.trueFpts || p.fpts) > 0) ? (p.high - p.low) / (p.trueFpts || p.fpts) : null;
    const riskAdjValue = Math.round(myValue * (1 - (FRAGILITY_DISCOUNT[p.pos] || 0)) * 10) / 10;
    return { ...p, value, myValue, riskAdjValue, needZone: ns ? ns.zone : null, rangePct, baselines: baselines[p.pos] };
  });
}

function livePickIndex(){
  return pickOrder.filter(p => !p.isPreset).length;
}

function picksUntilTurnFrom(startIdx){
  let idx = startIdx;
  if (idx >= SNAKE_ORDER.length) return { count: 0, teams: [] };
  if (SNAKE_ORDER[idx] === MY_TEAM) return { count: 0, teams: [] };
  const teams = [];
  let i = idx;
  while (i < SNAKE_ORDER.length && SNAKE_ORDER[i] !== MY_TEAM){
    teams.push(SNAKE_ORDER[i]);
    i++;
  }
  return { count: teams.length, teams };
}

function picksUntilMyNextTurn(){
  return picksUntilTurnFrom(livePickIndex());
}

// For the Survives column / simulation specifically: if it's currently my turn, forecast the
// window AFTER this pick (i.e. what happens once I've picked and I'm waiting for my next turn),
// rather than showing a meaningless zero-length window.
function simulationWindow(){
  const idx = livePickIndex();
  const current = picksUntilTurnFrom(idx);
  if (current.count > 0) return { window: current, startPick: idx + 1 };
  return { window: picksUntilTurnFrom(idx + 1), startPick: idx + 2 };
}

function teamPositionCounts(teamId){
  const counts = { QB:0, RB:0, WR:0, TE:0, K:0 };
  pickOrder.forEach(p => {
    if (p.by !== teamId) return;
    const pl = PLAYERS.find(x => x.name === p.name);
    if (pl && counts.hasOwnProperty(pl.pos)) counts[pl.pos]++;
  });
  return counts;
}

function teamNeedMult(teamId, pos, counts){
  if (NEED_MIN.hasOwnProperty(pos)){
    // RB/WR share the FLEX pool -- reuse the exact same zone logic as your own roster.
    return needState(pos, counts).mult;
  }
  const have = counts[pos] || 0;
  if (have >= GENERIC_MAX[pos]) return 0.15;
  if (have < GENERIC_MIN[pos]) return 1.3;
  // Real, observed behavior: plenty of teams actively grab a 2nd QB, sometimes ahead of an
  // open RB/WR need -- treat that as a genuine boost, not just neutral, in the OPPONENT model only.
  // This is deliberately separate from mySingleSlotNeedState/My Value, which reflects the user's
  // own roster need, not other teams' drafting habits.
  if (pos === 'QB' && have === GENERIC_MIN[pos]) return 1.2;
  return 1.0;
}

// Blend weight for League Value vs Sleeper rank, as a function of overall pick number.
// Mostly League Value through pick 60, mostly Sleeper past pick 80, linear transition between.
// Blend weight for League Value vs Sleeper rank, as a function of overall pick number.
// Mostly Sleeper (with a little League Value) early, mostly League Value (with a little Sleeper) late.
// This ONLY affects the market-rank input to the Survives/Next Pick/Risk Radar simulation --
// it never touches League Value or My Value themselves, which stay pure FPTS/VOLS/VOLF always.
function leagueValueWeight(pickNumber){
  if (pickNumber <= 60) return 0.15;
  if (pickNumber >= 80) return 1.0;
  return 0.15 + (pickNumber - 60) / 20 * 0.85;
}

function buildRankMaps(availablePlayers){
  const byValue = [...availablePlayers].sort((a,b) => b.value - a.value);
  const lvRank = {};
  byValue.forEach((p,i) => lvRank[p.name] = i+1);

  const worstSleeperRank = Math.max(0, ...Object.values(SLEEPER_RANK));
  const unranked = byValue.filter(p => !SLEEPER_RANK.hasOwnProperty(p.name));
  const slRank = {};
  availablePlayers.forEach(p => {
    if (SLEEPER_RANK.hasOwnProperty(p.name)) slRank[p.name] = SLEEPER_RANK[p.name];
  });
  unranked.forEach((p,i) => slRank[p.name] = worstSleeperRank + 1 + i);
  return { lvRank, slRank };
}

function blendedScore(lvRank, slRank, p, pickNumber){
  const wFP = leagueValueWeight(pickNumber);
  const wSL = 1 - wFP;
  const blendedRank = wFP * lvRank[p.name] + wSL * slRank[p.name];
  return 10000 / Math.max(1, blendedRank);
}

// Monte-Carlo simulate the picks between now and my next turn.
function simulateForecast(availablePlayers, teamsInWindow, runs, startingPickNumber){
  const survivalCount = {};
  const bestPickCount = {};
  const positionReplacementSum = { QB: 0, RB: 0, WR: 0, TE: 0, K: 0 };
  availablePlayers.forEach(p => { survivalCount[p.name] = 0; bestPickCount[p.name] = 0; });
  if (teamsInWindow.length === 0){
    // it's already your turn -- the "likely next pick" is just the best available player right now.
    availablePlayers.forEach(p => survivalCount[p.name] = runs);
    let top = null, topVal = -Infinity;
    availablePlayers.forEach(p => { if (p.myValue > topVal){ topVal = p.myValue; top = p; } });
    if (top) bestPickCount[top.name] = runs;
    ['QB','RB','WR','TE','K'].forEach(pos => {
      const bestAtPos = availablePlayers.filter(p => p.pos === pos).sort((a,b)=>b.myValue-a.myValue)[0];
      positionReplacementSum[pos] = bestAtPos ? bestAtPos.myValue * runs : 0;
    });
    const positionReplacementAvg = {};
    Object.keys(positionReplacementSum).forEach(pos => positionReplacementAvg[pos] = positionReplacementSum[pos] / runs);
    return { survivalCount, bestPickCount, positionReplacementAvg };
  }
  const baseCounts = {};
  teamsInWindow.forEach(t => { if(!baseCounts[t]) baseCounts[t] = teamPositionCounts(t); });
  const { lvRank, slRank } = buildRankMaps(availablePlayers);

  for (let run = 0; run < runs; run++){
    const takenThisRun = new Set();
    const runCounts = {};
    Object.keys(baseCounts).forEach(t => runCounts[t] = {...baseCounts[t]});
    teamsInWindow.forEach((team, stepIdx) => {
      const pickNumber = startingPickNumber + stepIdx;
      let best = null, bestScore = -Infinity;
      for (const p of availablePlayers){
        if (takenThisRun.has(p.name)) continue;
        const lean = (TEAM_LEAN[team] && TEAM_LEAN[team][p.pos]) || 1.0;
        const needMult = teamNeedMult(team, p.pos, runCounts[team]);
        const noise = 0.75 + Math.random() * 0.5;
        const score = blendedScore(lvRank, slRank, p, pickNumber) * lean * needMult * noise;
        if (score > bestScore){ bestScore = score; best = p; }
      }
      if (best){
        takenThisRun.add(best.name);
        runCounts[team][best.pos] = (runCounts[team][best.pos]||0) + 1;
      }
    });
    // Track, per run, the best surviving player at EACH position -- this is "what I'd actually
    // still have to choose from at that position by my real next turn," not just today's 2nd-best.
    const bestSurvivorByPos = { QB: null, RB: null, WR: null, TE: null, K: null };
    let myTop = null, myTopVal = -Infinity;
    availablePlayers.forEach(p => {
      if (!takenThisRun.has(p.name)){
        survivalCount[p.name]++;
        if (p.myValue > myTopVal){ myTopVal = p.myValue; myTop = p; }
        if (!bestSurvivorByPos[p.pos] || p.myValue > bestSurvivorByPos[p.pos].myValue) bestSurvivorByPos[p.pos] = p;
      }
    });
    if (myTop) bestPickCount[myTop.name]++;
    Object.keys(bestSurvivorByPos).forEach(pos => {
      if (bestSurvivorByPos[pos]) positionReplacementSum[pos] += bestSurvivorByPos[pos].myValue;
    });
  }
  const positionReplacementAvg = {};
  Object.keys(positionReplacementSum).forEach(pos => positionReplacementAvg[pos] = positionReplacementSum[pos] / runs);
  return { survivalCount, bestPickCount, positionReplacementAvg };
}

function myByeCounts(){
  const counts = {};
  pickOrder.forEach(p => {
    if (p.by !== MY_TEAM) return;
    const pl = PLAYERS.find(x => x.name === p.name);
    if (pl && pl.bye) counts[pl.bye] = (counts[pl.bye] || 0) + 1;
  });
  return counts;
}

let showRadar = false;

function renderRadar(fullAvailable, survivalCounts, SIM_RUNS, simWinCount){
  const el = document.getElementById('radarPanel');
  if (!showRadar){ el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = 'block';

  if (simWinCount === 0){
    el.innerHTML = `<div class="radarwrap"><h3>Risk Radar</h3><div class="radarsub">No forecast window right now (nothing left to wait through).</div></div>`;
    return;
  }

  const candidates = fullAvailable.filter(p => survivalCounts.hasOwnProperty(p.name)).slice(0, 18);
  if (candidates.length === 0){
    el.innerHTML = `<div class="radarwrap"><h3>Risk Radar</h3><div class="radarsub">Not enough data yet.</div></div>`;
    return;
  }

  const W = 760, H = 340, padL = 50, padR = 30, padT = 30, padB = 40;
  const values = candidates.map(p => p.value);
  const minV = Math.min(...values), maxV = Math.max(...values);
  const xScale = v => padL + (maxV === minV ? 0.5 : (v - minV) / (maxV - minV)) * (W - padL - padR);
  const yScale = pct => padT + (pct / 100) * (H - padT - padB); // 0% (urgent) at top, 100% (safe) at bottom

  const posColor = { QB:'#B79DE8', RB:'#5FBF77', WR:'#5C8AD6', TE:'#E8B04B', K:'#8A93A3' };

  let dots = '';
  candidates.forEach(p => {
    const pct = Math.round(100 * survivalCounts[p.name] / SIM_RUNS);
    const x = xScale(p.value);
    const y = yScale(pct);
    const color = posColor[p.pos] || '#8A93A3';
    const shortName = p.name.length > 14 ? p.name.split(' ').map((w,i,a)=> i===0&&a.length>1 ? w[0]+'.' : w).join(' ') : p.name;
    dots += `<g class="radar-dot" data-tip="${p.name} (${p.pos}) — Value ${p.value.toFixed(1)}, Survives ${pct}%">
      <circle cx="${x}" cy="${y}" r="6" fill="${color}" fill-opacity="0.85" stroke="${color}"/>
      <text class="radar-label" x="${x+8}" y="${y+3}">${shortName}</text>
    </g>`;
  });

  const midX = (padL + (W-padR)) / 2;
  const midY = yScale(50);

  el.innerHTML = `<div class="radarwrap">
    <h3>Risk Radar</h3>
    <div class="radarsub">Value (right = better) vs. odds of surviving to your next turn (top = about to vanish, bottom = safe to wait). Hover a dot for details.</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#2E3542"/>
      <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#2E3542"/>
      <line x1="${midX}" y1="${padT}" x2="${midX}" y2="${H-padB}" stroke="#2E3542" stroke-dasharray="4,4"/>
      <line x1="${padL}" y1="${midY}" x2="${W-padR}" y2="${midY}" stroke="#2E3542" stroke-dasharray="4,4"/>
      <text class="radar-quadrant-label" x="${W-padR-8}" y="${padT+16}" text-anchor="end">TAKE NOW</text>
      <text class="radar-quadrant-label" x="${W-padR-8}" y="${H-padB-8}" text-anchor="end">SAFE TO WAIT</text>
      <text class="radar-label" x="${padL}" y="${H-padB+16}">← Lower Value</text>
      <text class="radar-label" x="${W-padR}" y="${H-padB+16}" text-anchor="end">Higher Value →</text>
      <text class="radar-label" x="${padL-6}" y="${padT+4}" text-anchor="end">Urgent</text>
      <text class="radar-label" x="${padL-6}" y="${H-padB}" text-anchor="end">Safe</text>
      ${dots}
    </svg>
  </div>`;

  el.querySelectorAll('.radar-dot').forEach(dot => {
    dot.addEventListener('mouseenter', () => { dot.setAttribute('title', dot.dataset.tip); });
  });
  // native title tooltips as a simple, dependency-free hover
  el.querySelectorAll('.radar-dot').forEach(dot => {
    const t = document.createElementNS('http://www.w3.org/2000/svg','title');
    t.textContent = dot.dataset.tip;
    dot.appendChild(t);
  });
}

function renderRunAlert(){

  const recent = pickOrder.slice(-5);
  if (recent.length < 3){ el.innerHTML = ''; return; }
  const posCounts = {};
  const posTeams = {};
  recent.forEach(p => {
    const pl = PLAYERS.find(x => x.name === p.name);
    if (pl) {
      posCounts[pl.pos] = (posCounts[pl.pos] || 0) + 1;
      (posTeams[pl.pos] = posTeams[pl.pos] || new Set()).add(TEAM_NAME[p.by] || p.by);
    }
  });
  const runs = Object.entries(posCounts).filter(([pos,c]) => c >= 3 && (pos==='RB'||pos==='WR'||pos==='TE'));
  if (runs.length === 0){ el.innerHTML = ''; return; }
  el.innerHTML = runs.map(([pos,c]) =>
    `<div class="runalert">⚠ ${pos} RUN: ${c} of the last ${recent.length} picks were ${pos} (${[...posTeams[pos]].join(', ')}) — the position is going faster than normal, consider reaching now if you have a target</div>`
  ).join('');
}

function renderRecommendations(window_, bestPickCounts, SIM_RUNS){
  const valued = computeValues();
  const avail = valued.filter(p => !drafted[p.name]);
  const recEl = document.getElementById('recPanel');
  if (avail.length === 0){ recEl.innerHTML = `<div class="empty-feed">Draft complete</div>`; return; }

  if (window_.count === 0){
    // It's actually your turn -- show actionable recommendations.
    const byMy = [...avail].sort((a,b) => b.myValue - a.myValue);
    const byLeague = [...avail].sort((a,b) => b.value - a.value);
    const top15My = byMy.slice(0,15);
    const bySafety = [...top15My].filter(p => p.rangePct != null).sort((a,b) => a.rangePct - b.rangePct);

    const picks = [];
    const used = new Set();
    function add(tag, why, player){
      if (!player || used.has(player.name)) return;
      used.add(player.name);
      picks.push({ tag, why, player });
    }

    add('Top pick', 'Best need-adjusted value available right now', byMy[0]);
    const topPickIsAlsoBestValue = byLeague[0] && byMy[0] && byLeague[0].name === byMy[0].name;
    add('Best raw value', 'Highest league-wide value, ignoring your roster need', byLeague.find(p=>!used.has(p.name)));
    const urgent = byMy.find(p => p.needZone === 'urgent' && !used.has(p.name));
    add('Fills biggest hole', 'Best player at your most urgent position need', urgent);
    const safe = bySafety.find(p => !used.has(p.name));
    add('Safest floor', 'Lowest boom/bust risk among your top options', safe);

    recEl.innerHTML = `<div class="rectag" style="color:var(--green);margin-bottom:8px;">🎯 YOUR TURN — pick now</div>` +
      picks.slice(0,4).map((r,i) => `
      <div class="rec ${i===0?'main':''}">
        <div class="rectag">${r.tag}${i===0 && topPickIsAlsoBestValue ? ' &middot; also #1 by raw value' : ''}</div>
        <div class="recval">${r.player.myValue>=0?'+':''}${r.player.myValue.toFixed(1)}</div>
        <div class="recname">${r.player.name}<span class="posbadge pb-${r.player.pos}">${r.player.pos}</span></div>
        <div class="recwhy">${i===1 && topPickIsAlsoBestValue ? 'Next-best by raw value (top pick already claims #1)' : r.why}</div>
      </div>`).join('');
    return;
  }

  // Not your turn yet -- show the forecast instead: who you're likely to actually end up
  // taking once the intervening picks play out, not just who looks best right now.
  // Always show up to 4 candidates, even if one dominates every simulated run -- a 100%/0%/0%/0%
  // split is still worth seeing in full, not collapsed down to a single name.
  const withCounts = avail.map(p => ({
    player: p,
    pct: bestPickCounts.hasOwnProperty(p.name) ? Math.round(100 * bestPickCounts[p.name] / SIM_RUNS) : 0
  }));
  const winners = withCounts.filter(r => r.pct > 0).sort((a,b) => b.pct - a.pct);
  const usedNames = new Set(winners.map(r => r.player.name));
  const runnersUp = withCounts
    .filter(r => !usedNames.has(r.player.name))
    .sort((a,b) => b.player.myValue - a.player.myValue);
  const ranked = [...winners, ...runnersUp].slice(0, 4);

  recEl.innerHTML = `<div class="rectag" style="color:var(--blue);margin-bottom:8px;">⏳ ${window_.count} pick${window_.count===1?'':'s'} until your turn — forecast</div>` +
    ranked.map((r,i) => `
    <div class="rec ${i===0?'main':''}">
      <div class="rectag">${i===0?'Most likely next pick':(r.pct>0?'Also possible':'Longer shot')}</div>
      <div class="recval">${r.pct}%</div>
      <div class="recname">${r.player.name}<span class="posbadge pb-${r.player.pos}">${r.player.pos}</span></div>
      <div class="recwhy">${r.pct>0 ? 'Chance this is your best available option when your turn comes' : 'Didn\'t win a simulated run this batch, but a real remaining option'}</div>
    </div>`).join('');
}

function renderNeedBar(){
  const counts = myCounts();
  const bar = document.getElementById('needBar');
  const labels = { urgent: 'NEEDED', neutral: 'FLEX ONLY', discount: 'BENCH ONLY' };
  bar.innerHTML = ['RB','WR'].map(pos => {
    const ns = needState(pos, counts);
    return `<div class="needchip ${ns.zone}"><span class="tag">${pos}</span>${ns.have} drafted &middot; ${labels[ns.zone]}${ns.zone!=='discount' ? ` (${ns.zone==='urgent'?ns.remMin+' guaranteed slot'+(ns.remMin===1?'':'s')+' left':ns.remMax+' flex slot'+(ns.remMax===1?'':'s')+' left'})` : ''}</div>`;
  }).join('');
}

function render(){
  try {
    renderInner();
  } catch (e) {
    const boardEl = document.getElementById('board');
    if (boardEl) {
      boardEl.innerHTML = `<div class="row" style="color:var(--red);padding:16px;">
        Something failed while rendering the board. Error: ${(e && e.message) ? e.message.replace(/</g,'&lt;') : 'unknown'}.
        Try closing and reopening the tool. If this keeps happening, this exact message is worth sharing so it can be fixed.
      </div>`;
    }
    console.error('render() failed:', e);
  }
}

function renderInner(){
  const valued = computeValues();
  let pool = activeTab === 'ALL' ? valued : valued.filter(p => p.pos === activeTab);
  pool = pool.filter(p => showDrafted ? true : !drafted[p.name]);
  if (searchTerm) pool = pool.filter(p => p.name.toLowerCase().includes(searchTerm));

  const window_ = picksUntilMyNextTurn();
  const simWin = simulationWindow();
  const fullAvailable = valued.filter(p => !drafted[p.name]).sort((a,b) => b.value - a.value).slice(0, 120);
  const forecast = simulateForecast(fullAvailable, simWin.window.teams, 250, simWin.startPick);
  const survivalCounts = forecast.survivalCount;
  const bestPickCounts = forecast.bestPickCount;
  const positionReplacementAvg = forecast.positionReplacementAvg;
  const SIM_RUNS = 250;

  // Take-Now Score: My Value plus a real urgency premium, based on what you'd ACTUALLY still have
  // at this position by your next turn (simulated, not just today's 2nd-best) if this player is gone.
  // If the likely replacement is nearly as good (e.g. two similarly-valued QBs), there's little real
  // cost to waiting even if his own survival is low -- so no inflated urgency in that case. Urgency
  // only shows up when BOTH his own survival is low AND the real drop-off to what you'd get instead is large.
  function takeNowScore(p){
    const survivalFraction = survivalCounts.hasOwnProperty(p.name) ? survivalCounts[p.name] / SIM_RUNS : 1.0;
    const replacementValue = (positionReplacementAvg && positionReplacementAvg[p.pos] != null) ? positionReplacementAvg[p.pos] : p.myValue;
    const gapToReplacement = Math.max(0, p.myValue - replacementValue);
    const urgencyPremium = (1 - survivalFraction) * gapToReplacement;
    return p.myValue + urgencyPremium;
  }

  const sortKey = viewMode === 'mine' ? 'myValue' : (viewMode === 'riskadj' ? 'riskAdjValue' : 'value');
  if (viewMode === 'nextpick'){
    pool.sort((a,b) => (bestPickCounts[b.name]||0) - (bestPickCounts[a.name]||0));
  } else if (viewMode === 'takenow'){
    pool.sort((a,b) => takeNowScore(b) - takeNowScore(a));
  } else {
    pool.sort((a,b) => b[sortKey] - a[sortKey]);
  }

  const boardEl = document.getElementById('board');
  const valHeader = viewMode === 'mine' ? 'My Val' : (viewMode === 'riskadj' ? 'Risk-Adj' : (viewMode === 'nextpick' ? 'Next Pick %' : (viewMode === 'takenow' ? 'Take-Now' : 'Value')));
  let html = `<div class="row hdr"><div>#</div><div>Player</div><div>Fpts</div><div>${valHeader}</div><div>Survives</div><div></div></div>`;

  const showLine = activeTab !== 'ALL' && !searchTerm;
  const N_starter = showLine ? STARTER_N[activeTab] : null;
  const N_flex = showLine ? FLEX_N[activeTab] : null;
  let remainingCount = 0;
  const byeCounts = myByeCounts();
  const recentGaps = [];

  pool.forEach((p, i) => {
    const isDrafted = !!drafted[p.name];
    if (showLine && !isDrafted){
      remainingCount++;
      if (remainingCount === N_starter + 1){
        html += `<div class="repline">STARTER LINE — replacement is ${activeTab}${N_starter}</div>`;
      }
      if (N_flex && remainingCount === N_flex + 1){
        html += `<div class="repline">FLEX LINE — replacement is ${activeTab}${N_flex}</div>`;
      }
    }
    if (i > 0 && !isDrafted && !drafted[pool[i-1].name]){
      const gap = pool[i-1][sortKey] - p[sortKey];
      recentGaps.push(gap);
      if (recentGaps.length > 5) recentGaps.shift();
      const trailingAvg = recentGaps.slice(0,-1).reduce((a,b)=>a+b,0) / Math.max(1, recentGaps.length-1);
      if (gap > 2 && recentGaps.length > 2 && gap > trailingAvg * 1.75){
        html += `<div class="tierbreak">— tier break —</div>`;
      }
    }
    let shownVal, valSuffix = '';
    if (viewMode === 'nextpick'){
      shownVal = isDrafted ? 0 : Math.round(100 * (bestPickCounts[p.name]||0) / SIM_RUNS);
      valSuffix = '%';
    } else if (viewMode === 'mine'){
      shownVal = p.myValue;
    } else if (viewMode === 'riskadj'){
      shownVal = p.riskAdjValue;
    } else if (viewMode === 'takenow'){
      shownVal = isDrafted ? 0 : Math.round(takeNowScore(p) * 10) / 10;
    } else {
      shownVal = p.value;
    }
    const valClass = shownVal >= 0 ? 'pos' : 'neg';
    const needTag = (viewMode === 'mine' && p.needZone) ? `<span class="posbadge pb-${p.needZone==='urgent'?'TE':p.needZone==='discount'?'K':'QB'}" style="margin-left:4px;">${p.needZone==='urgent'?'NEED':p.needZone==='discount'?'BENCH':'FLEX'}</span>` : '';
    const byeConflict = p.bye && byeCounts[p.bye] >= 2;
    const byeTag = p.bye ? `<span class="byetag ${byeConflict?'conflict':''}">bye ${p.bye}${byeConflict?' ⚠':''}</span>` : '';
    const flagTag = p.flagType ? `<span class="flagtag ${p.flagType}" title="${p.flagWhy||''}">${p.flagType==='risk'?'RISK':'OPP'}</span>` : '';
    let survivalHTML = '';
    if (!isDrafted && survivalCounts.hasOwnProperty(p.name)){
      const pct = Math.round(100 * survivalCounts[p.name] / SIM_RUNS);
      const cls = pct >= 70 ? 'pos' : (pct >= 40 ? '' : 'neg');
      survivalHTML = `<span class="val ${cls}" style="font-size:11px;">${simWin.window.count===0 ? '—' : pct+'%'}</span>`;
    }
    html += `<div class="row ${isDrafted?'drafted':''}">
      <div class="rank">${i+1}</div>
      <div class="name">${p.name}<span class="posbadge pb-${p.pos}">${p.pos}</span>${needTag}${flagTag}${byeTag}</div>
      <div class="fpts">${p.fpts.toFixed(1)}</div>
      <div class="val ${valClass}">${viewMode==='nextpick' ? shownVal+'%' : (shownVal>=0?'+':'')+shownVal.toFixed(1)}</div>
      <div>${survivalHTML}</div>
      <div class="acts">
        ${isDrafted
          ? `<span class="byetag" style="margin-right:6px;">${TEAM_NAME[drafted[p.name]] || drafted[p.name]}</span><button class="btn undo" data-undo="${p.name}">Undo</button>`
          : `<select class="teamsel" data-teamsel="${p.name}"><option value="">Draft →</option>${TEAMS.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select>`}
      </div>
    </div>`;
  });
  boardEl.innerHTML = html;

  boardEl.querySelectorAll('[data-teamsel]').forEach(sel => {
    sel.addEventListener('change', () => {
      if (sel.value) draftPlayer(sel.dataset.teamsel, sel.value);
    });
  });
  boardEl.querySelectorAll('[data-undo]').forEach(btn => {
    btn.addEventListener('click', () => undoPlayer(btn.dataset.undo));
  });

  renderRoster();
  renderFeed();
  renderNeedBar();
  renderRecommendations(window_, bestPickCounts, SIM_RUNS);
  renderRunAlert();
  renderTurnBanner();
  updateActiveTabClasses();
  renderRadar(fullAvailable, survivalCounts, SIM_RUNS, simWin.window.count);
  document.getElementById('subtitle').textContent =
    `${PLAYERS.length - Object.keys(drafted).length} of ${PLAYERS.length} players still available`;
}

function renderRoster(){
  const rosterEl = document.getElementById('roster');
  const teamOfInterest = rosterViewTeam;
  const picks = pickOrder.filter(p => p.by === teamOfInterest).map(p => PLAYERS.find(x => x.name === p.name));
  const slots = ROSTER_SLOTS.map(s => ({ slot: s, filled: null }));
  picks.forEach(pl => {
    if (!pl) return;
    let slot = slots.find(s => s.slot === pl.pos && !s.filled);
    if (!slot && (pl.pos === 'RB' || pl.pos === 'WR' || pl.pos === 'TE')){
      slot = slots.find(s => s.slot === 'FLEX' && !s.filled);
    }
    if (slot) slot.filled = pl;
    else slots.push({ slot: 'BN', filled: pl });
  });

  const byeCounts = {};
  slots.forEach(s => { if (s.filled && s.filled.bye) byeCounts[s.filled.bye] = (byeCounts[s.filled.bye]||0) + 1; });

  rosterEl.innerHTML = slots.map(s => {
    const pl = s.filled;
    const name = pl ? pl.name : 'empty';
    const byeHTML = (pl && pl.bye) ? `<span class="byetag ${byeCounts[pl.bye]>=2?'conflict':''}">bye ${pl.bye}${byeCounts[pl.bye]>=2?' \u26a0':''}</span>` : '';
    return `<div class="slot"><span class="slotlabel">${s.slot}</span><span class="slotname ${pl?'':'empty'}">${name}${byeHTML}</span></div>`;
  }).join('');
}

function renderFeed(){
  const feedEl = document.getElementById('feed');
  if (pickOrder.length === 0){
    feedEl.innerHTML = `<div class="empty-feed">No picks yet</div>`;
    return;
  }
  feedEl.innerHTML = pickOrder.slice().reverse().slice(0,12).map(p =>
    `<div class="feeditem"><span>${p.name}</span><span class="feedwho ${p.by===MY_TEAM?'mine':'opp'}">${TEAM_NAME[p.by] || p.by}</span></div>`
  ).join('');
}

async function saveState(){
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify({ drafted, pickOrder }));
  } catch(e){}
}

async function loadState(){
  try {
    const res = await window.storage.get(STORAGE_KEY);
    if (res && res.value){
      const parsed = JSON.parse(res.value);
      drafted = parsed.drafted || {};
      pickOrder = parsed.pickOrder || [];
    }
  } catch(e){}
}

function draftPlayer(name, by){
  drafted[name] = by;
  pickOrder.push({ name, by });
  saveState();
  render();
}

function undoPlayer(name){
  delete drafted[name];
  pickOrder = pickOrder.filter(p => p.name !== name);
  saveState();
  render();
}

document.getElementById('search').addEventListener('input', (e) => {
  searchTerm = e.target.value.toLowerCase();
  render();
});
document.getElementById('draftedToggle').addEventListener('click', () => {
  showDrafted = !showDrafted;
  const btn = document.getElementById('draftedToggle');
  btn.textContent = showDrafted ? 'Showing Drafted' : 'Show Drafted';
  btn.classList.toggle('on', showDrafted);
  render();
});
document.getElementById('radarToggle').addEventListener('click', () => {
  showRadar = !showRadar;
  const btn = document.getElementById('radarToggle');
  btn.textContent = showRadar ? 'Hide Radar' : 'Risk Radar';
  btn.classList.toggle('on', showRadar);
  render();
});
document.getElementById('resetBtn').addEventListener('click', async () => {
  drafted = {};
  pickOrder = [];
  PRESET_KEEPERS.forEach(k => { drafted[k.name] = k.team; pickOrder.push({ name: k.name, by: k.team, isPreset: true }); });
  await saveState();
  render();
});

function reconcilePresetKeepers(){
  const currentPairs = new Set(PRESET_KEEPERS.map(k => k.name + '|' + k.team));
  const existingPresetPairs = new Set(pickOrder.filter(p => p.isPreset).map(p => p.name + '|' + p.by));
  let changed = false;

  // Remove preset entries that no longer match the current keeper list (e.g. a keeper correction).
  // Only ever touches entries flagged isPreset -- real live picks are never affected.
  pickOrder = pickOrder.filter(p => {
    if (!p.isPreset) return true;
    if (!currentPairs.has(p.name + '|' + p.by)){
      delete drafted[p.name];
      changed = true;
      return false;
    }
    return true;
  });

  // Add any current presets that are missing, but never overwrite a name that's already
  // genuinely drafted (e.g. if it happens to have been picked live in the meantime).
  PRESET_KEEPERS.forEach(k => {
    const key = k.name + '|' + k.team;
    if (!existingPresetPairs.has(key) && !drafted[k.name]){
      drafted[k.name] = k.team;
      pickOrder.push({ name: k.name, by: k.team, isPreset: true });
      changed = true;
    }
  });

  return changed;
}

(async function init(){
  try {
    await loadState();
    if (pickOrder.length === 0){
      PRESET_KEEPERS.forEach(k => { drafted[k.name] = k.team; pickOrder.push({ name: k.name, by: k.team, isPreset: true }); });
      await saveState();
    } else {
      const changed = reconcilePresetKeepers();
      if (changed) await saveState();
    }
    renderTabs();
    render();
  } catch (e) {
    const boardEl = document.getElementById('board');
    if (boardEl) {
      boardEl.innerHTML = `<div class="row" style="color:var(--red);padding:16px;">
        The draft tool failed to load. Error: ${(e && e.message) ? e.message.replace(/</g,'&lt;') : 'unknown'}.
        Try closing and reopening. If this keeps happening, this exact message is worth sharing so it can be fixed.
      </div>`;
    }
    console.error('init() failed:', e);
  }
})();
</script>
